<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TCG Invoicing</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --blue:#045494; --blue-deep:#033f70; --ink:#0F1729; --navy:#0A1F3D;
    --cream:#F2EFE8; --offwhite:#FAFAF7; --white:#fff; --slate:#475569; --slate-light:#94a3b8;
    --accent:#B8D4F0; --accent-2:#7DA8DC; --line:#e3ddd0; --green:#1f7a4d; --amber:#b07a1a; --red:#b03030; --gray:#64748b;
    --shadow:0 1px 2px rgba(10,31,61,.06),0 8px 24px rgba(10,31,61,.06); --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:'Inter Tight',sans-serif;letter-spacing:-.01em}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate)}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--white);width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-2);outline-offset:-1px}
  label.fld>span{display:block;font-size:12px;font-weight:600;color:var(--slate);margin-bottom:5px}
  .app{display:flex;min-height:100vh}
  .sidebar{width:232px;background:var(--navy);color:#dce6f2;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
  .brand .mark{font-family:'Inter Tight';font-weight:800;font-size:22px;color:var(--white);letter-spacing:-.02em}
  .brand .mark span{color:var(--accent-2)}
  .brand .sub{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2);margin-top:4px}
  nav.tabs{padding:14px 12px;display:flex;flex-direction:column;gap:2px}
  nav.tabs button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 13px;border-radius:9px;color:#b9c7da;font-size:14px;font-weight:500}
  nav.tabs button .ic{width:17px;height:17px;opacity:.85}
  nav.tabs button:hover{background:rgba(255,255,255,.06);color:#fff}
  nav.tabs button.active{background:var(--blue);color:#fff;font-weight:600}
  .sidebar .foot{margin-top:auto;padding:16px 20px;font-size:11px;color:#6f83a0;line-height:1.6;border-top:1px solid rgba(255,255,255,.08)}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{background:var(--offwhite);border-bottom:1px solid var(--line);padding:16px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:20}
  .topbar h1{font-size:21px;font-weight:700}
  .topbar .sb{font-size:13px;color:var(--slate);margin-top:1px}
  .content{padding:28px 30px 60px;max-width:1200px;width:100%}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:9px;font-size:14px;font-weight:600;background:var(--blue);color:#fff;transition:background .15s}
  .btn:hover{background:var(--blue-deep)}
  .btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--white);border-color:var(--accent-2)}
  .btn.sm{padding:6px 11px;font-size:13px}
  .btn.danger{background:transparent;color:var(--red);border:1px solid #e7c9c9}
  .btn.danger:hover{background:#fbeeee}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .kpi{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow)}
  .kpi .lbl{font-family:'JetBrains Mono';font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
  .kpi .val{font-family:'Inter Tight';font-size:27px;font-weight:700;margin-top:7px;color:var(--ink)}
  .kpi .val.blue{color:var(--blue)} .kpi .val.red{color:var(--red)} .kpi .val.green{color:var(--green)}
  .kpi .meta{font-size:12px;color:var(--gray);margin-top:3px}
  .panel{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:22px}
  .panel-h{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .panel-h h3{font-size:15.5px;font-weight:700}
  .panel-b{padding:18px 20px}
  .grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:22px}
  table.tbl{width:100%;border-collapse:collapse;font-size:14px}
  table.tbl th{text-align:left;font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.tbl td{padding:12px 14px;border-bottom:1px solid #f0ece2;vertical-align:middle}
  table.tbl tr:last-child td{border-bottom:none}
  table.tbl tbody tr:hover{background:#faf8f3}
  table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
  .row-click{cursor:pointer}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;font-family:'JetBrains Mono';letter-spacing:.03em;text-transform:uppercase}
  .pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.draft{color:var(--gray);background:#eef0f3} .pill.sent{color:var(--blue);background:#e6eff7}
  .pill.partial{color:var(--amber);background:#fcf3e0} .pill.paid{color:var(--green);background:#e6f3ec} .pill.overdue{color:var(--red);background:#fbeaea}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .toolbar .grow{flex:1;min-width:160px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--white)}
  .seg button{padding:8px 13px;font-size:13px;font-weight:600;color:var(--slate);border-right:1px solid var(--line)}
  .seg button:last-child{border-right:none}
  .seg button.active{background:var(--blue);color:#fff}
  .empty{text-align:center;padding:50px 20px;color:var(--gray)}
  .empty h3{font-size:17px;color:var(--ink);margin-bottom:6px}
  .chart{display:flex;align-items:flex-end;gap:8px;height:180px;padding-top:10px}
  .chart .bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
  .chart .bar{width:100%;max-width:34px;background:linear-gradient(180deg,var(--accent-2),var(--blue));border-radius:5px 5px 0 0;min-height:2px;transition:height .3s}
  .chart .bl{font-size:10.5px;color:var(--slate);font-family:'JetBrains Mono'} .chart .bv{font-size:10px;color:var(--gray);font-variant-numeric:tabular-nums}
  .overlay{position:fixed;inset:0;background:rgba(10,31,61,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:100;overflow-y:auto}
  .modal{background:var(--offwhite);border-radius:14px;width:100%;max-width:760px;box-shadow:0 24px 70px rgba(10,31,61,.3)}
  .modal-h{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-h h2{font-size:18px}
  .modal-b{padding:22px 24px;max-height:70vh;overflow-y:auto}
  .modal-f{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
  .x{font-size:22px;color:var(--slate);line-height:1;padding:4px 8px;border-radius:6px}
  .x:hover{background:var(--line)}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .form-grid .full{grid-column:1/-1}
  .li-row{display:grid;grid-template-columns:1fr 78px 110px 110px 34px;gap:8px;align-items:start;margin-bottom:10px}
  .li-head{font-size:11px;font-weight:600;color:var(--slate);align-items:center}
  .li-row .del{color:var(--red);font-size:18px;text-align:center;border-radius:6px;align-self:center}
  .li-row .del:hover{background:#fbeaea}
  .li-row .amt{font-variant-numeric:tabular-nums;align-self:center;text-align:right}
  .totals{margin-top:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .totals .tr{display:flex;gap:30px;font-size:14px;min-width:240px;justify-content:space-between}
  .totals .tr.grand{font-family:'Inter Tight';font-weight:800;font-size:19px;color:var(--blue);border-top:1px solid var(--line);padding-top:8px}
  .pay-list .pl-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#f3f6fb;border:1px solid #e1eaf5;border-radius:8px;margin-bottom:6px;font-size:13px}
  .clientreadout{background:#eef4fb;border:1px solid #d8e6f5;border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink);margin-top:4px}
  .clientreadout .h{font-size:11px;color:var(--slate);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
  .help{font-size:12.5px;color:var(--gray)}
  .stack{display:flex;flex-direction:column;gap:16px}
  .inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:200;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.warn{background:var(--amber)} .toast.err{background:var(--red)}
  .banner{background:#fcf3e0;border:1px solid #f0dca8;color:#6b5212;padding:11px 16px;border-radius:10px;font-size:13px;margin-bottom:18px;display:flex;gap:10px;align-items:flex-start}
  .banner b{color:#4a3a0c}
  .map-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;align-items:center}
  .map-grid .ml{font-size:13px;font-weight:600}
  .login-wrap{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--cream)}
  .login-card{background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:28px;max-width:380px;width:100%}
  .login-card h2{font-size:22px;margin-bottom:4px}
  .login-card .sub{font-size:13px;color:var(--slate);margin-bottom:22px}
  .menu-btn{display:none;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--white);color:var(--ink);flex-shrink:0}
  .menu-btn:hover{border-color:var(--accent-2)}
  .menu-btn svg{width:20px;height:20px}
  .backdrop{display:none;position:fixed;inset:0;background:rgba(10,31,61,.5);z-index:55}
  @media (max-width:860px){
    .menu-btn{display:inline-flex}
    .sidebar{position:fixed;top:0;left:0;height:100vh;z-index:60;transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 14px 40px rgba(0,0,0,.35)}
    .sidebar.open{transform:translateX(0)}
    .backdrop.open{display:block}
    .kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.content,.topbar{padding-left:18px;padding-right:18px}
  }
  /* print */
  .print-only{display:none}
  @media print{.app{display:none!important}.overlay{display:none!important}.print-only{display:block!important}body{background:#fff}@page{size:letter;margin:16mm}}
  #printArea{color:#1a1a1a;font-family:'Inter',sans-serif;font-size:14px}
  #printArea .pi-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
  #printArea .pi-logo{max-height:66px;max-width:300px;object-fit:contain}
  #printArea .co{font-family:'Inter Tight';font-weight:800;font-size:26px;color:var(--blue)}
  #printArea .co span{color:var(--ink)}
  #printArea .pi-title{text-align:right}
  #printArea .pi-title h2{font-family:'Inter Tight','Inter',sans-serif;font-weight:500;font-size:40px;letter-spacing:.01em;color:#222;line-height:1}
  #printArea .pi-biz{text-align:right;font-size:13px;color:#333;line-height:1.55;margin-bottom:26px}
  #printArea .pi-biz .bn{font-weight:700;color:#111}
  #printArea .pi-mid{display:flex;justify-content:space-between;gap:40px;margin-bottom:24px}
  #printArea .pi-mid .bill .h,#printArea .pi-mid .meta .h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#999;margin-bottom:5px}
  #printArea .pi-mid .bill .cn{font-weight:700;font-size:15px}
  #printArea .pi-mid .meta{min-width:300px}
  #printArea .pi-mid .meta .mrow{display:flex;justify-content:space-between;gap:24px;padding:2px 0;font-size:13.5px}
  #printArea .pi-mid .meta .mrow .k{color:#555;font-weight:600;text-align:right;flex:1}
  #printArea .pi-mid .meta .mrow.invno{font-size:18px;padding:6px 0 8px;border-bottom:1px solid #eee;margin-bottom:4px}
  #printArea .pi-mid .meta .mrow.invno .k{color:#333}
  #printArea .pi-mid .meta .mrow.invno .v{font-weight:800;color:#0F1729;letter-spacing:.005em}
  #printArea .pi-mid .meta .mrow.ad{background:#f1f1f1;padding:7px 10px;margin-top:6px;border-radius:4px;font-weight:700;font-size:14.5px}
  #printArea table.pt{width:100%;border-collapse:collapse;margin-bottom:18px}
  #printArea table.pt th{background:#045494;color:#fff;text-align:left;padding:10px 14px;font-size:12px;font-weight:600}
  #printArea table.pt th.num,#printArea table.pt td.num{text-align:right}
  #printArea table.pt td{padding:12px 14px;border-bottom:1px solid #e8e8e8;font-size:13.5px;vertical-align:top}
  #printArea table.pt .it-title{font-weight:700;color:#111}
  #printArea table.pt .it-detail{color:#666;font-size:12.5px;margin-top:2px}
  #printArea .pt-tot{width:300px;margin-left:auto}
  #printArea .pt-tot .r{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px solid #eee}
  #printArea .pt-tot .r.ad{font-weight:700;font-size:15.5px;border-bottom:none;border-top:2px solid #333;margin-top:4px;padding-top:10px}
  #printArea .pi-foot{margin-top:46px;font-size:12.5px;color:#666;border-top:1px solid #e5e5e5;padding-top:12px;white-space:pre-wrap}
  /* ===== state presence tracker ===== */
  .st-bar{position:relative;height:8px;border-radius:5px;background:#ece7db;overflow:hidden;min-width:110px}
  .st-bar i{position:absolute;left:0;top:0;height:100%;border-radius:5px}
  .st-bar i.ghost{opacity:.3}
  .st-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px}
  .cal-year{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:20px 18px}
  .cal-m .cal-t{font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);margin-bottom:7px}
  .cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-g .dow{font-size:9px;color:var(--slate-light);text-align:center;font-family:'JetBrains Mono';padding-bottom:3px}
  .cal-d{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:600;color:#fff;cursor:pointer;font-variant-numeric:tabular-nums;border:1.5px solid transparent}
  .cal-d:hover{outline:2px solid var(--ink);outline-offset:1px}
  .cal-d.pad{background:none!important;cursor:default;pointer-events:none}
  .cal-d.none{color:var(--slate)}
  .cal-d.ovr{border-color:var(--ink)}
  .cal-d.future{opacity:.4}
  .legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--slate)}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tbl-wrap>table.tbl{min-width:540px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="print-only"><div id="printArea"></div></div>
<div id="toast" class="toast"></div>

<script>
/* ===== Supabase wiring ===== */
const SUPABASE_URL='https://kjltyavevgacqhahejdc.supabase.co';
const SUPABASE_KEY='sb_publishable_CsASjkFGBRyo9ZzPBqRQhg_5NOrd3X5';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let store=null, view='dashboard', editingInvoice=null, editingClient=null, importState=null;

/* ===== utilities ===== */
const $=(s,el=document)=>el.querySelector(s);
const uid=()=>'id_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const todayISO=()=>new Date().toISOString().slice(0,10);
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};
const fmtMoney=n=>{const c=store?.settings?.currency||'USD';try{return new Intl.NumberFormat('en-US',{style:'currency',currency:c}).format(n||0);}catch{return '$'+(Number(n)||0).toFixed(2);}};
const fmtDate=iso=>{if(!iso)return '—';const d=new Date(iso+(iso.length===10?'T00:00:00':''));if(isNaN(d))return iso;return d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});};
function toast(m,k){const t=$('#toast');if(!t)return;t.textContent=m;t.className='toast show'+(k?' '+k:'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2600);}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ===== math ===== */
function lineTotal(li){return num(li.quantity)*num(li.rate);}
function invoiceSubtotal(inv){return (inv.lineItems||[]).reduce((s,li)=>s+lineTotal(li),0);}
function invoiceTotal(inv){const sub=invoiceSubtotal(inv),disc=num(inv.discount);return Math.max(0,sub-disc+(sub-disc)*(num(inv.taxRate)/100));}
function invoicePaid(inv){return (store.payments||[]).filter(p=>p.invoiceId===inv.id).reduce((s,p)=>s+num(p.amount),0);}
function invoiceBalance(inv){return invoiceTotal(inv)-invoicePaid(inv);}
function invoiceState(inv){const t=invoiceTotal(inv),p=invoicePaid(inv);if(t>0&&p>=t-0.005)return 'paid';if(p>0.005)return 'partial';if(inv.status==='sent'&&inv.dueDate&&inv.dueDate<todayISO())return 'overdue';return inv.status||'draft';}
function clientById(id){return (store.clients||[]).find(c=>c.id===id)||null;}
function clientName(id){const c=clientById(id);return c?c.name:'Unknown client';}
function getClientByName(name){if(!name)return null;return (store.clients||[]).find(c=>c.name.trim().toLowerCase()===String(name).trim().toLowerCase());}

/* ===== DB <-> app mappers ===== */
function defaultSettings(){return {business:{name:'The Casey Group',email:'',phone:'',website:'',addressLines:[],tagline:'',logo:''},currency:'USD',invoicePrefix:'2026-',nextNumber:1,defaultTaxRate:0,paymentTermsDays:30,notesDefault:'',homeState:''};}
function fromDBClient(r){return {id:r.id,name:r.name||'',contactName:r.contact_name||'',email:r.email||'',addressLines:r.address_lines||[]};}
function toDBClient(o){return {id:o.id,name:o.name,contact_name:o.contactName||'',email:o.email||'',address_lines:o.addressLines||[]};}
function fromDBInvoice(r){return {id:r.id,number:r.number||'',clientId:r.client_id||'',issueDate:r.issue_date||'',dueDate:r.due_date||'',status:r.status||'draft',lineItems:r.line_items||[],taxRate:Number(r.tax_rate)||0,discount:Number(r.discount)||0,notes:r.notes||''};}
function toDBInvoice(o){return {id:o.id,number:o.number,client_id:o.clientId||null,issue_date:o.issueDate||null,due_date:o.dueDate||null,status:o.status||'draft',line_items:o.lineItems||[],tax_rate:num(o.taxRate),discount:num(o.discount),notes:o.notes||''};}
function fromDBPayment(r){return {id:r.id,invoiceId:r.invoice_id,date:r.date||'',amount:Number(r.amount)||0,method:r.method||'',note:r.note||''};}
function toDBPayment(o){return {id:o.id,invoice_id:o.invoiceId,date:o.date||null,amount:num(o.amount),method:o.method||'',note:o.note||''};}
function fromDBTrip(r){return {id:r.id,state:r.state||'',startDate:r.start_date||'',endDate:r.end_date||'',purpose:r.purpose||'',travelDaysHome:r.travel_days_home!==false,createdAt:r.created_at||''};}
function toDBTrip(o){return {id:o.id,state:o.state,start_date:o.startDate,end_date:o.endDate,purpose:o.purpose||'',travel_days_home:!!o.travelDaysHome};}
function fromDBOverride(r){return {id:r.id,date:r.date,state:r.state||'',note:r.note||'',sticky:r.sticky===true};}
function toDBOverride(o){return {id:o.id,date:o.date,state:o.state,note:o.note||'',sticky:!!o.sticky};}

/* ===== load + persist ===== */
async function loadStore(){
  const [c,i,p,s,t,o]=await Promise.all([
    sb.from('clients').select('*'),
    sb.from('invoices').select('*'),
    sb.from('payments').select('*'),
    sb.from('settings').select('data').eq('id',1).maybeSingle(),
    sb.from('location_trips').select('*'),
    sb.from('location_overrides').select('*')
  ]);
  for(const r of [c,i,p,s,t,o]){if(r.error)throw r.error;}
  const def=defaultSettings();
  const settings=Object.assign({},def,s.data?.data||{});
  settings.business=Object.assign({},def.business,(s.data?.data?.business)||{});
  store={settings,clients:(c.data||[]).map(fromDBClient),invoices:(i.data||[]).map(fromDBInvoice),payments:(p.data||[]).map(fromDBPayment),trips:(t.data||[]).map(fromDBTrip),overrides:(o.data||[]).map(fromDBOverride)};
}

let _settingsTimer=null;
function persistSettings(){
  clearTimeout(_settingsTimer);
  _settingsTimer=setTimeout(async ()=>{
    const {error}=await sb.from('settings').upsert({id:1,data:store.settings});
    if(error){console.error(error);toast('Settings save failed: '+error.message,'err');}
  },400);
}

async function dbUpsertClient(c){const {error}=await sb.from('clients').upsert(toDBClient(c));if(error)throw error;}
async function dbDeleteClient(id){const {error}=await sb.from('clients').delete().eq('id',id);if(error)throw error;}
async function dbUpsertPayment(p){const {error}=await sb.from('payments').upsert(toDBPayment(p));if(error)throw error;}
async function dbDeletePayment(id){const {error}=await sb.from('payments').delete().eq('id',id);if(error)throw error;}
async function dbUpsertTrip(t){const {error}=await sb.from('location_trips').upsert(toDBTrip(t));if(error)throw error;}
async function dbDeleteTrip(id){const {error}=await sb.from('location_trips').delete().eq('id',id);if(error)throw error;}
async function dbUpsertOverride(o){const {error}=await sb.from('location_overrides').upsert(toDBOverride(o));if(error)throw error;}

function renderLogin(msg){

    <h2>TCG Invoicing</h2><div class="sub">Sign in to your invoices.</div>
    <div class="stack">

      <label class="fld"><span>Password</span><input id="loginPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" /></label>
      ${msg?`<p style="color:var(--red);font-size:13px;margin:0">${escapeHtml(msg)}</p>`:''}
      <button class="btn" onclick="doLogin()" style="justify-content:center">Sign in</button>
    </div>
  </div></div>`;
  setTimeout(()=>{const el=$('#loginPass');if(el)el.focus();},20);

async function doLogin(){
  const email=$('#loginEmail').value.trim();
  const password=$('#loginPass').value;
  if(!email||!password){renderLogin('Enter email and password');return;}
  const btn=document.querySelector('.login-card .btn');if(btn){btn.textContent='Signing in…';btn.disabled=true;}
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){renderLogin(error.message);return;}
  await boot();
}
async function signOut(){await sb.auth.signOut();location.reload();}

/* ===== dashboard ===== */
function renderDashboard(){
  const invs=store.invoices||[];const yr=new Date().getFullYear();
  let collectedYTD=0,outstanding=0,overdue=0,overdueCount=0;
  (store.payments||[]).forEach(p=>{if((p.date||'').slice(0,4)==String(yr))collectedYTD+=num(p.amount);});
  invs.forEach(inv=>{const bal=invoiceBalance(inv),st=invoiceState(inv);if(st!=='draft')outstanding+=Math.max(0,bal);if(st==='overdue'){overdue+=Math.max(0,bal);overdueCount++;}});
  const allTime=(store.payments||[]).reduce((s,p)=>s+num(p.amount),0);
  if(!invs.length&&!(store.payments||[]).length)return emptyState('No data yet','Import your Excel file in Settings, add a client, or create your first invoice.',`<button class="btn" onclick="go('settings')">Import Excel</button> <button class="btn ghost" onclick="openInvoice()">New invoice</button>`);
  const months=Array.from({length:12},()=>0);
  (store.payments||[]).forEach(p=>{const d=p.date||'';if(d.slice(0,4)==String(yr)){const m=parseInt(d.slice(5,7))-1;if(m>=0&&m<12)months[m]+=num(p.amount);}});
  const maxM=Math.max(1,...months);const ml=['J','F','M','A','M','J','J','A','S','O','N','D'];
  const chart=months.map((v,i)=>`<div class="bar-wrap" title="${ml[i]}: ${fmtMoney(v)}"><div class="bv">${v?(v>=1000?'$'+Math.round(v/1000)+'k':'$'+Math.round(v)):''}</div><div class="bar" style="height:${Math.round(v/maxM*100)}%"></div><div class="bl">${ml[i]}</div></div>`).join('');
  const byC={};(store.payments||[]).forEach(p=>{const inv=invs.find(i=>i.id===p.invoiceId);if(!inv)return;byC[inv.clientId]=(byC[inv.clientId]||0)+num(p.amount);});
  const top=Object.entries(byC).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const recent=[];(store.payments||[]).forEach(p=>{const inv=invs.find(i=>i.id===p.invoiceId);recent.push({date:p.date,label:`Payment ${fmtMoney(p.amount)} · ${inv?escapeHtml(inv.number):'?'}`});});
  invs.forEach(inv=>recent.push({date:inv.issueDate,label:`Invoice ${escapeHtml(inv.number)} · ${escapeHtml(clientName(inv.clientId))}`}));
  recent.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const rr=recent.slice(0,8).map(r=>`<tr><td style="white-space:nowrap;color:var(--slate)">${fmtDate(r.date)}</td><td>${r.label}</td></tr>`).join('')||`<tr><td colspan="2" class="help">No activity yet.</td></tr>`;
  return `
  <div class="kpis">
    <div class="kpi"><div class="lbl">Collected ${yr}</div><div class="val green">${fmtMoney(collectedYTD)}</div><div class="meta">${fmtMoney(allTime)} all-time</div></div>
    <div class="kpi"><div class="lbl">Outstanding</div><div class="val blue">${fmtMoney(outstanding)}</div><div class="meta">across open invoices</div></div>
    <div class="kpi"><div class="lbl">Overdue</div><div class="val ${overdue>0?'red':''}">${fmtMoney(overdue)}</div><div class="meta">${overdueCount} past due</div></div>
    <div class="kpi"><div class="lbl">Invoices</div><div class="val">${invs.length}</div><div class="meta">${(store.clients||[]).length} clients</div></div>
  </div>
  <div class="grid2">
    <div class="panel"><div class="panel-h"><h3>Collected by month · ${yr}</h3></div><div class="panel-b"><div class="chart">${chart}</div></div></div>
    <div class="panel"><div class="panel-h"><h3>Top clients</h3><span class="eyebrow">by collected</span></div><div class="panel-b">${top.length?top.map(([cid,amt])=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0ece2"><span>${escapeHtml(clientName(cid))}</span><b style="font-variant-numeric:tabular-nums">${fmtMoney(amt)}</b></div>`).join(''):'<div class="help">No payments recorded yet.</div>'}</div></div>
  </div>
  <div class="panel"><div class="panel-h"><h3>Recent activity</h3></div><div class="panel-b" style="padding:0"><table class="tbl"><tbody>${rr}</tbody></table></div></div>`;
}

let invFilter={q:'',status:'all',year:'all'};
function renderInvoices(){
  const invs=store.invoices||[];
  if(!invs.length)return emptyState('No invoices yet','Create one, or import your Excel data from Settings.',`<button class="btn" onclick="openInvoice()">+ New invoice</button> <button class="btn ghost" onclick="go('settings')">Import Excel</button>`);
  const years=Array.from(new Set(invs.map(i=>(i.issueDate||'').slice(0,4)).filter(Boolean))).sort().reverse();
  return `
  <div class="toolbar">
    <div class="grow"><input placeholder="Search invoice # or client…" value="${escapeHtml(invFilter.q)}" oninput="invFilter.q=this.value;refreshInvoiceTable()" /></div>
    <div class="seg">${['all','draft','sent','partial','overdue','paid'].map(s=>`<button class="${invFilter.status===s?'active':''}" onclick="invFilter.status='${s}';render()">${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}</div>
    <select style="width:auto" onchange="invFilter.year=this.value;render()"><option value="all"${invFilter.year==='all'?' selected':''}>All years</option>${years.map(y=>`<option value="${y}"${invFilter.year===y?' selected':''}>${y}</option>`).join('')}</select>
  </div>
  <div class="panel"><div class="panel-b" style="padding:0" id="invTableWrap"><table class="tbl"><thead><tr><th>Invoice #</th><th>Client</th><th>Issued</th><th>Due</th><th>Status</th><th class="num">Total</th><th class="num">Balance</th><th></th></tr></thead><tbody>${invoiceRows()}</tbody></table></div></div>`;
}
function invoiceRows(){
  let rows=(store.invoices||[]).slice().sort((a,b)=>(b.issueDate||'').localeCompare(a.issueDate||'')||(b.number||'').localeCompare(a.number||''));
  if(invFilter.status!=='all')rows=rows.filter(i=>invoiceState(i)===invFilter.status);
  if(invFilter.year!=='all')rows=rows.filter(i=>(i.issueDate||'').slice(0,4)===invFilter.year);
  if(invFilter.q){const q=invFilter.q.toLowerCase();rows=rows.filter(i=>(i.number||'').toLowerCase().includes(q)||clientName(i.clientId).toLowerCase().includes(q));}
  return rows.map(inv=>{const st=invoiceState(inv);return `<tr class="row-click" onclick="openInvoice('${inv.id}')"><td><b>${escapeHtml(inv.number)}</b></td><td>${escapeHtml(clientName(inv.clientId))}</td><td style="white-space:nowrap;color:var(--slate)">${fmtDate(inv.issueDate)}</td><td style="white-space:nowrap;color:var(--slate)">${fmtDate(inv.dueDate)}</td><td><span class="pill ${st}">${st}</span></td><td class="num">${fmtMoney(invoiceTotal(inv))}</td><td class="num" style="color:${invoiceBalance(inv)>0.005?'var(--red)':'var(--green)'}">${fmtMoney(invoiceBalance(inv))}</td><td style="text-align:right"><button class="btn ghost sm" title="Download PDF" onclick="event.stopPropagation();downloadPdf('${inv.id}')">↓ PDF</button></td></tr>`;}).join('')||`<tr><td colspan="8" class="help" style="padding:24px">No invoices match these filters.</td></tr>`;
}
function refreshInvoiceTable(){const w=$('#invTableWrap tbody');if(w)w.innerHTML=invoiceRows();}

function addDays(iso,days){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+num(days));return d.toISOString().slice(0,10);}
function openInvoice(id){
  if(id){editingInvoice=JSON.parse(JSON.stringify(store.invoices.find(i=>i.id===id)));}

  editingInvoice._newClient=editingInvoice._newClient||{name:'',contactName:'',email:''};
  renderInvoiceModal();
}

  const li=inv.lineItems.map((l,idx)=>`

      <input type="number" step="0.01" value="${l.quantity}" oninput="liEdit(${idx},'quantity',this.value)" />

  const payments=existing?(store.payments||[]).filter(p=>p.invoiceId===inv.id):[];
  const payHtml=payments.length?`<div class="pay-list">${payments.map(p=>`<div class="pl-row"><span>${fmtDate(p.date)} · <b>${fmtMoney(p.amount)}</b> · ${escapeHtml(p.method||'')}${p.note?' · '+escapeHtml(p.note):''}</span><button class="del" style="color:var(--red);font-size:16px" onclick="delPayment('${p.id}')">×</button></div>`).join('')}</div>`:'';
  const ov=document.createElement('div');ov.className='overlay';ov.id='modalOverlay';ov.onclick=e=>{if(e.target===ov)closeModal();};

    <div class="modal-b">
      <div class="form-grid">

        <label class="fld"><span>Client</span><select onchange="invClientSelect(this.value)"><option value=""${!inv.clientId&&!inv._addingClient?' selected':''}>— Select client —</option>${clientOpts}<option value="__new"${inv._addingClient?' selected':''}>+ Add new client…</option></select></label>

        <label class="fld"><span>Tax rate (%)</span><input type="number" step="0.01" value="${inv.taxRate}" oninput="editingInvoice.taxRate=this.value;renderTotals()" /></label>

function totalsHtml(sub,disc,tax,total,existing,paid,bal){return `<div class="tr"><span>Subtotal</span><span>${fmtMoney(sub)}</span></div><div class="tr"><span>Discount</span><span>− ${fmtMoney(disc)}</span></div><div class="tr"><span>Tax (${num(editingInvoice.taxRate)}%)</span><span>${fmtMoney(tax)}</span></div><div class="tr grand"><span>Total</span><span>${fmtMoney(total)}</span></div>${existing?`<div class="tr"><span>Paid</span><span style="color:var(--green)">${fmtMoney(paid)}</span></div><div class="tr" style="font-weight:700"><span>Balance</span><span style="color:${bal>0.005?'var(--red)':'var(--green)'}">${fmtMoney(bal)}</span></div>`:''}`;}
function renderTotals(){const inv=editingInvoice,sub=invoiceSubtotal(inv),disc=num(inv.discount),tax=(sub-disc)*(num(inv.taxRate)/100),total=invoiceTotal(inv),existing=!inv.__isNew,paid=existing?invoicePaid(inv):0,bal=total-paid;const el=$('#modalTotals');if(el)el.innerHTML=totalsHtml(sub,disc,tax,total,existing,paid,bal);}
function liEdit(i,k,v){editingInvoice.lineItems[i][k]=v;if(k==='quantity'||k==='rate'){const a=$('#amt'+i);if(a)a.textContent=fmtMoney(lineTotal(editingInvoice.lineItems[i]));renderTotals();}}
function liAdd(){editingInvoice.lineItems.push({title:'',detail:'',quantity:1,rate:0});renderInvoiceModal();}
function liDel(i){editingInvoice.lineItems.splice(i,1);if(!editingInvoice.lineItems.length)editingInvoice.lineItems.push({title:'',detail:'',quantity:1,rate:0});renderInvoiceModal();}
function invClientSelect(val){if(val==='__new'){editingInvoice.clientId='';editingInvoice._addingClient=true;}else{editingInvoice.clientId=val;editingInvoice._addingClient=false;}renderInvoiceModal();}

async function saveInvoice(){
  const inv=editingInvoice;
  if(inv._addingClient){
    const nm=(inv._newClient.name||'').trim();
    if(!nm){toast('Enter the client name','warn');return;}
    let c=getClientByName(nm);

/* ===== state presence tracker ===== */
const STATE_NAMES={AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',CO:'Colorado',CT:'Connecticut',DE:'Delaware',DC:'District of Columbia',FL:'Florida',GA:'Georgia',HI:'Hawaii',ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',KS:'Kansas',KY:'Kentucky',LA:'Louisiana',ME:'Maine',MD:'Maryland',MA:'Massachusetts',MI:'Michigan',MN:'Minnesota',MS:'Mississippi',MO:'Missouri',MT:'Montana',NE:'Nebraska',NV:'Nevada',NH:'New Hampshire',NJ:'New Jersey',NM:'New Mexico',NY:'New York',NC:'North Carolina',ND:'North Dakota',OH:'Ohio',OK:'Oklahoma',OR:'Oregon',PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',TX:'Texas',UT:'Utah',VT:'Vermont',VA:'Virginia',WA:'Washington',WV:'West Virginia',WI:'Wisconsin',WY:'Wyoming',PR:'Puerto Rico',INTL:'Outside the U.S.'};
const AWAY_COLORS=['#B07A1A','#1F7A4D','#8B3A62','#A24B3B','#5B5BA8','#2E6F8E','#7A4E2E','#93502B','#3F7A6E','#436B2F','#8A6A2F','#6B3E6B'];
const RESIDENCY_THRESHOLD=183, WATCH_THRESHOLD=150;
let stateYear=new Date().getFullYear(), editingTrip=null;

function stateLabel(c){return c?(STATE_NAMES[c]||c):'Not set';}
function shortDate(iso){const d=parseISO(iso);return isNaN(d)?iso:d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function awayStates(){
  const st=new Set();
  (store.trips||[]).forEach(t=>{if(t.state)st.add(t.state);});
  (store.overrides||[]).forEach(o=>{if(o.state)st.add(o.state);});
  st.delete(store.settings.homeState);
  return Array.from(st).sort();
}
function stateColor(c){
  if(!c)return '#e7e2d6';
  if(c===store.settings.homeState)return '#045494';
  const i=awayStates().indexOf(c);
  return AWAY_COLORS[(i<0?0:i)%AWAY_COLORS.length];
}
function stateOptions(sel){return '<option value="">Select a state…</option>'+Object.keys(STATE_NAMES).map(c=>`<option value="${c}"${sel===c?' selected':''}>${c} — ${STATE_NAMES[c]}</option>`).join('');}
function pad2(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function parseISO(s){return new Date(s+'T00:00:00');}
function eachDay(a,b,fn){if(!a||!b||a>b)return;const d=parseISO(a),e=parseISO(b);if(isNaN(d)||isNaN(e))return;let g=0;while(d<=e&&g++<4000){fn(ymd(d));d.setDate(d.getDate()+1);}}
function dayCount(a,b){let n=0;eachDay(a,b,()=>n++);return n;}
function yearLength(y){return ((y%4===0&&y%100!==0)||y%400===0)?366:365;}

/* Resolve every day of a year to exactly one state, in four passes:
     1. the home state everywhere (or a carried-forward mark still in force from a prior year)
     2. marks flagged sticky carry their state forward until the next mark
     3. logged trips punch through for their explicit ranges, then the carry resumes
     4. every mark always wins on its own day, so a one-day fix inside a trip sticks */
function dayMap(year){
  const map=new Map(), home=store.settings.homeState||'';
  const marks=(store.overrides||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const jan1=year+'-01-01', dec31=year+'-12-31';
  let base=home, baseSrc=home?'home':'none', baseFrom='';
  for(const m of marks)if(m.sticky&&m.date&&m.date<jan1){base=m.state;baseSrc='carry';baseFrom=m.date;}
  eachDay(jan1,dec31,d=>map.set(d,{state:base,src:baseSrc,markDate:baseFrom}));
  for(const m of marks){
    if(!m.sticky||!m.date||m.date.slice(0,4)!==String(year))continue;
    eachDay(m.date,dec31,d=>map.set(d,{state:m.state,src:'carry',markDate:m.date}));
  }
  const trips=(store.trips||[]).slice().sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
  for(const t of trips)eachDay(t.startDate,t.endDate,d=>{if(map.has(d))map.set(d,{state:t.state,src:'trip',tripId:t.id});});
  for(const m of marks)if(map.has(m.date))map.set(m.date,{state:m.state,src:'override',note:m.note||'',sticky:!!m.sticky});
  return map;
}

/* Counting stops at today: days you have not lived yet are shown but not counted.
   Past years count in full; a future year counts nothing. */
function countThrough(year){
  const today=todayISO(), y=String(year), cy=today.slice(0,4);
  if(y<cy)return year+'-12-31';
  if(y>cy)return null;
  return today;
}

/* Presence days can double-count a travel day in two states — that is how the
   183-day tests actually work, so per-state totals may exceed the day count.
   Pass `through` to project a full year instead of stopping at today. */
function presence(year,through){
  const days=dayMap(year), sets=new Map(), home=store.settings.homeState||'';
  const cutoff=through===undefined?countThrough(year):through;
  const counted=d=>cutoff!==null&&d<=cutoff;
  const add=(st,d)=>{if(!st||!counted(d))return;if(!sets.has(st))sets.set(st,new Set());sets.get(st).add(d);};
  days.forEach((v,d)=>add(v.state,d));
  const travelDays=new Set();
  if(home)for(const t of (store.trips||[])){
    if(!t.travelDaysHome||t.state===home)continue;
    for(const d of [t.startDate,t.endDate]){
      const cur=days.get(d);
      if(!cur||cur.src==='override'||!counted(d))continue;
      add(home,d);travelDays.add(d);
    }
  }
  return {days,sets,travelDays,cutoff};
}
function thrClass(n){return n>=RESIDENCY_THRESHOLD?'overdue':n>=WATCH_THRESHOLD?'partial':'paid';}
function thrLabel(n){return n>=RESIDENCY_THRESHOLD?'At 183+':n>=WATCH_THRESHOLD?'Watch':'Clear';}

function renderStates(){
  const home=store.settings.homeState||'';
  const yrs=new Set([new Date().getFullYear(),stateYear]);
  (store.trips||[]).forEach(t=>{if(t.startDate)yrs.add(+t.startDate.slice(0,4));if(t.endDate)yrs.add(+t.endDate.slice(0,4));});
  (store.overrides||[]).forEach(o=>{if(o.date)yrs.add(+o.date.slice(0,4));});
  const years=Array.from(yrs).filter(y=>y>1900).sort((a,b)=>b-a);
  const {days,sets,travelDays,cutoff}=presence(stateYear);
  let unsetDays=0;
  days.forEach((v,d)=>{if(cutoff===null||d>cutoff)return;if(!v.state)unsetDays++;});
  const proj=presence(stateYear,stateYear+'-12-31').sets;
  const allStates=new Set([...sets.keys(),...proj.keys()]);
  const rows=Array.from(allStates).map(st=>({st,n:(sets.get(st)||new Set()).size,p:(proj.get(st)||new Set()).size}))
    .sort((a,b)=>b.n-a.n||b.p-a.p||a.st.localeCompare(b.st));

  const topAway=rows.filter(r=>r.st!==home)[0]||null;

  const toolbar=`<div class="toolbar">
    <div class="seg">${years.map(y=>`<button class="${y===stateYear?'active':''}" onclick="stateYear=${y};render()">${y}</button>`).join('')}</div>
    <label class="fld inline" style="gap:8px;margin:0"><span style="margin:0;white-space:nowrap">Home state</span><select style="width:auto;min-width:190px" onchange="setHomeState(this.value)">${stateOptions(home)}</select></label>
    <div style="flex:1 1 0;min-width:0"></div>
    <button class="btn ghost sm" onclick="exportStatesCSV()">Export ${stateYear} CSV</button>
    <button class="btn sm" onclick="openTrip()">+ Log trip</button>
  </div>`;

  const banner=home?'':`<div class="banner"><b>Pick your home state first.</b> Every day you don't log a trip for counts as your home state, so the totals below stay empty until you set it.</div>`;

  const awayMeta=topAway
    ?(RESIDENCY_THRESHOLD-topAway.n>0?(RESIDENCY_THRESHOLD-topAway.n)+' days to the 183-day line':'past the 183-day line')
    :(unsetDays?unsetDays+' days unassigned':'Nothing logged away from home');
  const kpis=`<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
    <div class="kpi"><div class="lbl">${escapeHtml(home||'Home')} days</div><div class="val blue">${homeN}</div><div class="meta">${homeN-homeBonus} full days + ${homeBonus} travel day${homeBonus===1?'':'s'}</div></div>
    <div class="kpi"><div class="lbl">${escapeHtml(topAway?topAway.st:'Away')} days</div><div class="val ${topAway&&topAway.n>=WATCH_THRESHOLD?'red':''}">${topAway?topAway.n:0}</div><div class="meta">${awayMeta}</div></div>
    <div class="kpi"><div class="lbl">Split of days</div>${splitHtml(rows)}</div>
  </div>`;

  const tblBody=rows.length?rows.map(r=>{
    const c=stateColor(r.st), pctA=Math.min(100,r.n/RESIDENCY_THRESHOLD*100), pctP=Math.min(100,r.p/RESIDENCY_THRESHOLD*100);
    const over=r.p>=RESIDENCY_THRESHOLD&&r.st!==home;
    return `<tr>
      <td><span class="st-dot" style="background:${c}"></span><b>${r.st}</b> <span class="help">${escapeHtml(STATE_NAMES[r.st]||'')}</span>${r.st===home?' <span class="pill sent">Home</span>':''}</td>
      <td class="num"><b>${r.n}</b></td>
      <td class="num" style="color:${over?'var(--red)':'var(--gray)'}">${r.p}${r.p>r.n?` <span style="font-size:12px">(+${r.p-r.n})</span>`:''}</td>
      <td><div class="st-bar"><i class="ghost" style="width:${pctP}%;background:${c}"></i><i style="width:${pctA}%;background:${c}"></i></div></td>
      <td>${r.st===home?'<span class="pill sent">Resident</span>':`<span class="pill ${thrClass(r.p)}">${thrLabel(r.p)}</span>`}</td>
    </tr>`;
  }).join(''):`<tr><td colspan="5" class="help" style="padding:24px">${cutoff===null?stateYear+' has not started yet — logged trips will count as the days arrive.':'Nothing to count yet for '+stateYear+'.'}</td></tr>`;

  const summary=`<div class="panel">
    <div class="panel-h"><h3>Presence days by state · ${stateYear}</h3><span class="eyebrow">${cutoff===null?'Not started':'Actual through '+shortDate(cutoff)}</span></div>
    <div class="panel-b tbl-wrap" style="padding:0"><table class="tbl"><thead><tr><th>State</th><th class="num">Actual</th><th class="num">Projected</th><th style="width:180px">Toward 183</th><th>Status</th></tr></thead><tbody>${tblBody}</tbody></table></div>
    <div class="panel-b" style="border-top:1px solid var(--line)"><p class="help"><b style="color:var(--ink)">Actual</b> counts only days you have already lived, through ${cutoff===null?stateYear:fmtDate(cutoff)}. <b style="color:var(--ink)">Projected</b> is where the year lands if every trip you have logged holds — the solid bar is actual, the faded bar is projected. The status badge follows the projection, so a state trending past 183 turns red before you get there.</p>
    <p class="help" style="margin-top:9px">A presence day is any day you set foot in the state, partial days included. Travel days therefore count in two states at once, so these totals can add up to more than ${yearLength(stateYear)}. The 183-day line is the common statutory-residency trigger, but the exact rule varies by state — treat this as your log, not as tax advice.</p></div>

  const ovr=(store.overrides||[]).filter(o=>(o.date||'').slice(0,4)===String(stateYear)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));

  return banner+toolbar+kpis+summary+calendar+tripPanel+ovrPanel;

/* Donut of the actual split, so the slices tie to the day counts on the cards beside it. */
function splitHtml(rows){
  const all=rows.filter(r=>r.n>0);
  if(!all.length)return `<div class="val">—</div><div class="meta">No days counted yet</div>`;
  let slices=all.slice(0,4).map(r=>({st:r.st,n:r.n,color:stateColor(r.st)}));
  const rest=all.slice(4).reduce((a,r)=>a+r.n,0);
  if(rest)slices.push({st:'Other',n:rest,color:'#9aa4b2'});
  const total=slices.reduce((a,s)=>a+s.n,0);
  const R=32, C=2*Math.PI*R;
  let off=0;
  const arcs=slices.map(s=>{
    const len=total?s.n/total*C:0;
    const el=`<circle cx="50" cy="50" r="${R}" fill="none" stroke="${s.color}" stroke-width="14" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 50 50)"></circle>`;
    off+=len;return el;
  }).join('');
  const pct=s=>total?Math.round(s.n/total*100):0;
  const legend=slices.map(s=>`<div class="inline" style="gap:7px;flex-wrap:nowrap;font-size:13px">
      <span class="st-dot" style="background:${s.color};margin:0;flex:none"></span><b>${escapeHtml(s.st)}</b>
      <span style="margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums"><b>${pct(s)}%</b> <span class="help">${s.n}d</span></span>
    </div>`).join('');
  return `<div class="inline" style="gap:15px;flex-wrap:nowrap;margin-top:11px">
    <svg viewBox="0 0 100 100" width="84" height="84" style="flex:none" role="img" aria-label="Share of days by state">
      <circle cx="50" cy="50" r="${R}" fill="none" stroke="#ece7db" stroke-width="14"></circle>${arcs}
    </svg>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:7px">${legend}</div>
  </div>`;
}

function calendarHtml(year,days){
  const today=todayISO();
  const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DOW=['S','M','T','W','T','F','S'];
  let out='';
  for(let m=0;m<12;m++){
    const lead=new Date(year,m,1).getDay(), dim=new Date(year,m+1,0).getDate();
    let cells=DOW.map(d=>`<div class="dow">${d}</div>`).join('');
    for(let i=0;i<lead;i++)cells+='<div class="cal-d pad"></div>';
    for(let d=1;d<=dim;d++){
      const iso=year+'-'+pad2(m+1)+'-'+pad2(d), v=days.get(iso)||{state:'',src:'none'};
      const cls=['cal-d'];
      if(v.src==='override')cls.push('ovr');
      if(!v.state)cls.push('none');
      if(iso>today)cls.push('future');
      const src=v.src==='override'?' (marked)':v.src==='trip'?' (trip)':v.src==='carry'?' (carried forward)':'';
      cells+=`<div class="${cls.join(' ')}" style="background:${stateColor(v.state)}" title="${escapeHtml(fmtDate(iso)+' · '+stateLabel(v.state)+src)}" onclick="openOverride('${iso}')">${d}</div>`;
    }
    out+=`<div class="cal-m"><div class="cal-t">${MN[m]}</div><div class="cal-g">${cells}</div></div>`;
  }
  return `<div class="cal-year">${out}</div>`;
}

async function saveTrip(){

  if(isNew&&!t.createdAt)t.createdAt=new Date().toISOString();
  try{await dbUpsertTrip(t);}catch(e){toast('Save failed: '+e.message,'err');t.__isNew=isNew;return;}

/* ===== excel import ===== */
function handleExcel(file){if(!file)return;const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});importState={wb,sheets:wb.SheetNames,sheet:wb.SheetNames[0],rows:null,headers:null,map:{}};loadSheet(wb.SheetNames[0]);renderImportModal();}catch(err){console.error(err);toast('Could not read that file','err');}};r.readAsArrayBuffer(file);}
function loadSheet(name){const ws=importState.wb.Sheets[name];const json=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});let hi=0;while(hi<json.length&&json[hi].every(c=>String(c).trim()===''))hi++;const headers=(json[hi]||[]).map(h=>String(h).trim());const rows=json.slice(hi+1).filter(r=>r.some(c=>String(c).trim()!=='')).map(r=>{const o={};headers.forEach((h,i)=>o[h]=r[i]);return o;});importState.sheet=name;importState.headers=headers;importState.rows=rows;importState.map=autoMap(headers);}
function autoMap(headers){const want={number:['invoice','invoice #','invoice number','number','inv','inv #','invoice no','no'],client:['client','customer','customer name','client name','company','bill to','account'],issueDate:['date','invoice date','issue date','issued','created'],dueDate:['due','due date','date due','payment due'],amount:['total','amount','invoice total','grand total','amount due','value'],paid:['paid','amount paid','payment','payments','paid amount','received'],status:['status','state'],title:['item','service','product','title'],detail:['description','memo','notes','details','line item']};const map={};const lc=headers.map(h=>h.toLowerCase());Object.entries(want).forEach(([f,names])=>{let idx=-1;for(const n of names){idx=lc.indexOf(n);if(idx>=0)break;}if(idx<0){for(let i=0;i<lc.length;i++){if(names.some(n=>lc[i].includes(n))){idx=i;break;}}}if(idx>=0)map[f]=headers[idx];});return map;}
function renderImportModal(){
  const fields=[['number','Invoice number',true],['client','Client / customer',true],['issueDate','Issue date',false],['dueDate','Due date',false],['amount','Invoice total',true],['paid','Amount already paid',false],['status','Status',false],['title','Item title',false],['detail','Detail / description',false]];
  const hOpts=sel=>`<option value="">— ignore —</option>`+importState.headers.map(h=>`<option value="${escapeHtml(h)}"${importState.map[sel]===h?' selected':''}>${escapeHtml(h)}</option>`).join('');
  const sOpts=importState.sheets.map(s=>`<option value="${escapeHtml(s)}"${importState.sheet===s?' selected':''}>${escapeHtml(s)}</option>`).join('');
  const ov=document.createElement('div');ov.className='overlay';ov.id='importOverlay';ov.onclick=e=>{if(e.target===ov)ov.remove();};
  ov.innerHTML=`<div class="modal" style="max-width:820px"><div class="modal-h"><h2>Map your Excel columns</h2><button class="x" onclick="this.closest('.overlay').remove()">×</button></div><div class="modal-b">
    <div class="inline" style="margin-bottom:16px"><label class="fld" style="max-width:260px"><span>Sheet</span><select onchange="loadSheet(this.value);renderImportModal()">${sOpts}</select></label><div class="help" style="align-self:flex-end;padding-bottom:10px">${importState.rows.length} data rows detected</div></div>
    <div class="map-grid">${fields.map(([f,label,req])=>`<div class="ml">${label}${req?' <span style="color:var(--red)">*</span>':''}</div><select onchange="importState.map['${f}']=this.value;renderImportPreview()">${hOpts(f)}</select>`).join('')}</div>
    <div class="banner" style="margin-top:18px"><span>ℹ</span><div>Map <b>Amount already paid</b> and a matching payment is created automatically. Existing invoice numbers are <b>skipped</b> (no duplicates).</div></div>
    <h4 style="margin:14px 0 8px;font-size:13px">Preview <span class="help">(first 5 rows)</span></h4><div id="importPreview" style="overflow-x:auto">${buildImportPreview()}</div>
  </div><div class="modal-f"><span class="help">Existing data is kept; rows are added.</span><div class="inline"><button class="btn ghost" onclick="this.closest('.overlay').remove()">Cancel</button><button class="btn" onclick="runImport()">Import ${importState.rows.length} rows</button></div></div></div>`;
  const ex=$('#importOverlay');if(ex)ex.remove();document.body.appendChild(ov);
}
function renderImportPreview(){const el=$('#importPreview');if(el)el.innerHTML=buildImportPreview();}
function buildImportPreview(){const m=importState.map;const rows=importState.rows.slice(0,5).map(r=>{const total=parseMoney(r[m.amount]);const paid=m.paid?parseMoney(r[m.paid]):0;return `<tr><td>${escapeHtml(r[m.number]||'')}</td><td>${escapeHtml(r[m.client]||'')}</td><td>${escapeHtml(parseDateLoose(r[m.issueDate])||'')}</td><td class="num">${total?fmtMoney(total):''}</td><td class="num">${m.paid?(paid?fmtMoney(paid):''):'—'}</td></tr>`;}).join('')||'<tr><td colspan="5" class="help">No rows.</td></tr>';return `<table class="tbl"><thead><tr><th>Invoice #</th><th>Client</th><th>Issued</th><th class="num">Total</th><th class="num">Paid</th></tr></thead><tbody>${rows}</tbody></table>`;}
function parseMoney(v){if(v==null||v==='')return 0;if(typeof v==='number')return v;const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;}
function parseDateLoose(v){if(v==null||v==='')return '';if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);if(typeof v==='number'){const d=new Date(Math.round((v-25569)*86400*1000));if(!isNaN(d))return d.toISOString().slice(0,10);}const d=new Date(String(v).trim());if(!isNaN(d))return d.toISOString().slice(0,10);return '';}
async function runImport(){
  const m=importState.map;
  if(!m.number||!m.client||!m.amount){toast('Map invoice #, client, and total first','warn');return;}
  const newClients=[],newInvoices=[],newPayments=[];
  let added=0,skipped=0,pays=0;
  const ensureCli=(name)=>{
    if(!name)return null;
    let c=getClientByName(name);
    if(c)return c;
    c={id:uid(),name:String(name).trim(),contactName:'',email:'',addressLines:[]};
    store.clients.push(c);newClients.push(c);
    return c;
  };
  importState.rows.forEach(r=>{
    const numv=String(r[m.number]||'').trim();if(!numv){skipped++;return;}
    if(store.invoices.some(i=>(i.number||'').trim().toLowerCase()===numv.toLowerCase())){skipped++;return;}
    const c=ensureCli(r[m.client]);
    const issue=parseDateLoose(r[m.issueDate])||'';
    const due=parseDateLoose(r[m.dueDate])||(issue?addDays(issue,store.settings.paymentTermsDays||30):'');
    const total=parseMoney(r[m.amount]);
    const title=m.title?String(r[m.title]||''):'Professional Fee';
    const detail=m.detail?String(r[m.detail]||''):'';
    let status='sent';if(m.status){const s=String(r[m.status]||'').toLowerCase();if(s.includes('draft'))status='draft';}
    const inv={id:uid(),number:numv,clientId:c?c.id:'',issueDate:issue,dueDate:due,status,lineItems:[{title:title||'Professional Fee',detail,quantity:1,rate:total}],taxRate:0,discount:0,notes:''};
    store.invoices.push(inv);newInvoices.push(inv);added++;
    if(m.paid){const paid=parseMoney(r[m.paid]);if(paid>0){const p={id:uid(),invoiceId:inv.id,date:issue||todayISO(),amount:paid,method:'Imported',note:'Imported from Excel'};store.payments.push(p);newPayments.push(p);pays++;}}
    const pfx=store.settings.invoicePrefix||'';
    if(numv.startsWith(pfx)){const n=parseInt(numv.slice(pfx.length));if(!isNaN(n)&&n>=store.settings.nextNumber)store.settings.nextNumber=n+1;}
  });
  try{
    if(newClients.length){const {error}=await sb.from('clients').upsert(newClients.map(toDBClient));if(error)throw error;}
    if(newInvoices.length){const {error}=await sb.from('invoices').upsert(newInvoices.map(toDBInvoice));if(error)throw error;}
    if(newPayments.length){const {error}=await sb.from('payments').upsert(newPayments.map(toDBPayment));if(error)throw error;}
    persistSettings();
  }catch(e){toast('Import failed: '+e.message,'err');return;}
  const o=$('#importOverlay');if(o)o.remove();render();toast(`Imported ${added} invoices${pays?`, ${pays} payments`:''}${skipped?`, skipped ${skipped}`:''}`);
}

/* ===== print + PDF ===== */
function logoBlock(){const logo=store.settings.business.logo;return logo?`<img class="pi-logo" src="${logo}" alt="logo" />`:`<div class="co">The Casey<span> Group</span></div>`;}
function buildPrintArea(inv){
  const c=clientById(inv.clientId)||{name:'',contactName:'',email:'',addressLines:[]};
  const b=store.settings.business;
  const sub=invoiceSubtotal(inv),disc=num(inv.discount),tax=(sub-disc)*(num(inv.taxRate)/100),total=invoiceTotal(inv),paid=invoicePaid(inv),bal=total-paid;
  const rows=inv.lineItems.map(l=>`<tr><td><div class="it-title">${escapeHtml(l.title||'')}</div>${l.detail?`<div class="it-detail">${escapeHtml(l.detail)}</div>`:''}</td><td class="num">${num(l.quantity)}</td><td class="num">${fmtMoney(l.rate)}</td><td class="num">${fmtMoney(lineTotal(l))}</td></tr>`).join('');
  const bizLines=(b.addressLines||[]).map(escapeHtml).join('<br/>');
  $('#printArea').innerHTML=`
    <div class="pi-top">${logoBlock()}<div class="pi-title"><h2>INVOICE</h2></div></div>
    <div class="pi-biz"><span class="bn">${escapeHtml(b.name||'')}</span>${bizLines?'<br/>'+bizLines:''}${(b.phone||b.website)?'<br/><br/>':''}${b.phone?escapeHtml(b.phone):''}${b.website?'<br/>'+escapeHtml(b.website):''}</div>
    <div class="pi-mid">
      <div class="bill"><div class="h">Bill To</div><div class="cn">${escapeHtml(c.name||'')}</div>${c.contactName?escapeHtml(c.contactName)+'<br/>':''}${(c.addressLines||[]).map(escapeHtml).join('<br/>')}${(c.addressLines&&c.addressLines.length)?'<br/>':''}${c.email?'<div style="margin-top:6px">'+escapeHtml(c.email)+'</div>':''}</div>
      <div class="meta">
        <div class="mrow invno"><span class="k">Invoice Number:</span><span class="v">${escapeHtml(inv.number)}</span></div>
        <div class="mrow"><span class="k">Invoice Date:</span><span>${fmtDate(inv.issueDate)}</span></div>
        <div class="mrow"><span class="k">Payment Due:</span><span>${fmtDate(inv.dueDate)}</span></div>
        <div class="mrow ad"><span class="k">Amount Due (USD):</span><span>${fmtMoney(bal)}</span></div>
      </div>
    </div>
    <table class="pt"><thead><tr><th>Items</th><th class="num">Quantity</th><th class="num">Price</th><th class="num">Amount</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="pt-tot">
      <div class="r"><span>Total:</span><span>${fmtMoney(total)}</span></div>
      ${(disc)?`<div class="r"><span>Discount:</span><span>− ${fmtMoney(disc)}</span></div>`:''}
      ${num(inv.taxRate)?`<div class="r"><span>Tax (${num(inv.taxRate)}%):</span><span>${fmtMoney(tax)}</span></div>`:''}
      ${paid?`<div class="r"><span>Paid:</span><span>− ${fmtMoney(paid)}</span></div>`:''}
      <div class="r ad"><span>Amount Due (USD):</span><span>${fmtMoney(bal)}</span></div>
    </div>
    ${inv.notes?`<div class="pi-foot">${escapeHtml(inv.notes)}</div>`:''}`;
}
// PDF generation = browser print dialog → pick "Save as PDF" as destination.
// The print stylesheet (#printArea + @media print) is the source of truth, so
// the saved PDF is pixel-identical to the on-screen print preview.
function downloadPdf(id){
  const inv=store.invoices.find(i=>i.id===id);
  if(!inv){toast('Invoice not found','err');return;}
  // Set the suggested filename via document title — most browsers use this
  // as the default Save-as-PDF filename.
  const originalTitle=document.title;
  document.title=`Invoice-${(inv.number||'invoice').replace(/[^\w\-]/g,'_')}`;
  buildPrintArea(inv);
  // Restore the title once the print dialog is dismissed (focus returns to window).
  const restore=()=>{document.title=originalTitle;window.removeEventListener('focus',restore);};
  window.addEventListener('focus',restore);
  setTimeout(()=>window.print(),60);
}
// printInvoice is now an alias for downloadPdf — same dialog handles both
// "physical printer" and "Save as PDF" destinations.
const printInvoice=downloadPdf;

/* ===== boot ===== */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){renderLogin();return;}
  try{await loadStore();render();}
  catch(e){console.error(e);renderLogin('Could not load data: '+(e.message||e));}
}
sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')location.reload();});
boot();
